[package]
name = "typesift"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Serhii Potapov <blake131313@gmail.com>"]
license = "MIT"
description = "A derive macro that walks structs, enums, collections and maps to collect every value of a given type"
keywords = ["derive", "traversal", "visitor", "reflection", "nested"]
categories = ["rust-patterns", "data-structures"]
repository = "https://github.com/greyblake/typesift"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
typesift-macros = { version = "0.1.0", path = "../typesift-macros" }
bytes = { version = "1", optional = true, default-features = false }
chrono = { version = "0.4", optional = true, default-features = false }
enum-map = { version = "3", optional = true, default-features = false }
http = { version = "1", optional = true }
indexmap = { version = "2", optional = true, default-features = false }
rust_decimal = { version = "1", optional = true, default-features = false }
serde_json = { version = "1", optional = true }
smallvec = { version = "1", optional = true, default-features = false }
time = { version = "0.3", optional = true, default-features = false }
url = { version = "2", optional = true }
uuid = { version = "1", optional = true, default-features = false }

# One feature per crate, matching the modules in `src/features`.
[features]
bytes = ["dep:bytes"]
chrono = ["dep:chrono"]
enum-map = ["dep:enum-map"]
http = ["dep:http"]
indexmap = ["dep:indexmap"]
rust_decimal = ["dep:rust_decimal"]
serde_json = ["dep:serde_json"]
smallvec = ["dep:smallvec"]
time = ["dep:time"]
url = ["dep:url"]
uuid = ["dep:uuid"]

[package.metadata.docs.rs]
all-features = true
