[package]
name = "typesift"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
typesift_macros = { version = "0.1.0", path = "../typesift_macros" }
uuid = { version = "1", optional = true, default-features = false }

# One feature per crate, matching the modules in `src/features`.
[features]
uuid = ["dep:uuid"]

[package.metadata.docs.rs]
all-features = true
